# Weekly dependency PRs for the backend and for the workflow actions once CI exists.
# Only version updates: security advisories arrive through GitHub's alerts regardless.
version: 2
updates:
  - package-ecosystem: maven
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns:
          - "org.springframework*"
      minor-and-patch:
        update-types:
          - minor
          - patch
