# Developer conveniences only. Activate with:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
springdoc:
  swagger-ui:
    enabled: true

teamvault:
  jwt:
    # Plain http://localhost: a Secure cookie would never come back from the browser or
    # the .http client. Every other profile keeps the default.
    refresh-cookie-secure: false
    