<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 750" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <title>TeamVault ERD: company and app_user joined by membership; file_metadata owned by company and uploaded by app_user</title>
  <style>
    .box   { fill: none; stroke: #1c232e; stroke-width: 1.4; }
    .sep   { stroke: #1c232e; stroke-width: 1.4; }
    .title { font-size: 13px; font-weight: 700; fill: #1c232e; }
    .col   { font-size: 12px; fill: #1c232e; }
    .typ   { font-size: 12px; fill: #57606a; }
    .tag   { font-size: 12px; font-weight: 700; fill: #2b5fae; text-anchor: end; }
    .note  { font-size: 11.5px; fill: #2b5fae; }
    .edge  { stroke: #1c232e; stroke-width: 1.6; fill: none; }
    .lbl   { font-size: 12px; font-family: system-ui, sans-serif; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .box, .sep   { stroke: #e6ebf2; }
      .title, .col { fill: #e6ebf2; }
      .typ, .lbl   { fill: #8b98a5; }
      .tag, .note  { fill: #7fa9ec; }
      .edge        { stroke: #e6ebf2; }
    }
  </style>

  <!-- edges: exactly one (double tick) at the parent, zero-or-many (circle + crow's foot) at the child -->
  <!-- company - membership -->
  <g class="edge">
    <polyline points="165,176 165,324 288,324"/>
    <line x1="159" y1="190" x2="171" y2="190"/>
    <line x1="159" y1="198" x2="171" y2="198"/>
    <circle cx="293" cy="324" r="5"/>
    <line x1="298" y1="324" x2="315" y2="316"/>
    <line x1="298" y1="324" x2="315" y2="324"/>
    <line x1="298" y1="324" x2="315" y2="332"/>
  </g>
  <text class="lbl" x="200" y="316">has</text>

  <!-- app_user - membership -->
  <g class="edge">
    <polyline points="700,198 700,324 581,324"/>
    <line x1="694" y1="212" x2="706" y2="212"/>
    <line x1="694" y1="220" x2="706" y2="220"/>
    <circle cx="576" cy="324" r="5"/>
    <line x1="570" y1="324" x2="555" y2="316"/>
    <line x1="570" y1="324" x2="555" y2="324"/>
    <line x1="570" y1="324" x2="555" y2="332"/>
  </g>
  <text class="lbl" x="640" y="316">holds</text>

  <!-- company - file_metadata -->
  <g class="edge">
    <polyline points="90,176 90,554 288,554"/>
    <line x1="84" y1="190" x2="96" y2="190"/>
    <line x1="84" y1="198" x2="96" y2="198"/>
    <circle cx="293" cy="554" r="5"/>
    <line x1="298" y1="554" x2="315" y2="546"/>
    <line x1="298" y1="554" x2="315" y2="554"/>
    <line x1="298" y1="554" x2="315" y2="562"/>
  </g>
  <text class="lbl" x="110" y="546">owns</text>

  <!-- app_user - file_metadata -->
  <g class="edge">
    <polyline points="770,198 770,586 581,586"/>
    <line x1="764" y1="212" x2="776" y2="212"/>
    <line x1="764" y1="220" x2="776" y2="220"/>
    <circle cx="576" cy="586" r="5"/>
    <line x1="570" y1="586" x2="555" y2="578"/>
    <line x1="570" y1="586" x2="555" y2="586"/>
    <line x1="570" y1="586" x2="555" y2="594"/>
  </g>
  <text class="lbl" x="740" y="578" text-anchor="end">uploads</text>

  <!-- company -->
  <rect class="box" x="50" y="50" width="230" height="126" rx="3"/>
  <line class="sep" x1="50" y1="80" x2="280" y2="80"/>
  <text class="title" x="62" y="70">company</text>
  <text class="col" x="62" y="96">id</text><text class="typ" x="185" y="96">uuid</text><text class="tag" x="268" y="96">PK</text>
  <text class="col" x="62" y="118">name</text><text class="typ" x="185" y="118">text</text>
  <text class="col" x="62" y="140">tier</text><text class="typ" x="185" y="140">text</text>
  <text class="col" x="62" y="162">created_at</text><text class="typ" x="185" y="162">timestamptz</text>

  <!-- app_user -->
  <rect class="box" x="580" y="50" width="240" height="148" rx="3"/>
  <line class="sep" x1="580" y1="80" x2="820" y2="80"/>
  <text class="title" x="592" y="70">app_user</text>
  <text class="col" x="592" y="96">id</text><text class="typ" x="715" y="96">uuid</text><text class="tag" x="808" y="96">PK</text>
  <text class="col" x="592" y="118">email</text><text class="typ" x="715" y="118">text</text><text class="tag" x="808" y="118">UQ</text>
  <text class="col" x="592" y="140">password_hash</text><text class="typ" x="715" y="140">text</text>
  <text class="col" x="592" y="162">display_name</text><text class="typ" x="715" y="162">text</text>
  <text class="col" x="592" y="184">created_at</text><text class="typ" x="715" y="184">timestamptz</text>

  <!-- membership -->
  <rect class="box" x="315" y="250" width="240" height="148" rx="3"/>
  <line class="sep" x1="315" y1="280" x2="555" y2="280"/>
  <text class="title" x="327" y="270">membership</text>
  <text class="col" x="327" y="296">id</text><text class="typ" x="450" y="296">uuid</text><text class="tag" x="543" y="296">PK</text>
  <text class="col" x="327" y="318">user_id</text><text class="typ" x="450" y="318">uuid</text><text class="tag" x="543" y="318">FK</text>
  <text class="col" x="327" y="340">company_id</text><text class="typ" x="450" y="340">uuid</text><text class="tag" x="543" y="340">FK</text>
  <text class="col" x="327" y="362">role</text><text class="typ" x="450" y="362">text</text>
  <text class="col" x="327" y="384">created_at</text><text class="typ" x="450" y="384">timestamptz</text>
  <text class="note" x="315" y="420">UNIQUE (company_id, user_id)</text>
  <text class="note" x="315" y="436">INDEX (user_id)</text>

  <!-- file_metadata -->
  <rect class="box" x="315" y="480" width="240" height="214" rx="3"/>
  <line class="sep" x1="315" y1="510" x2="555" y2="510"/>
  <text class="title" x="327" y="500">file_metadata</text>
  <text class="col" x="327" y="526">id</text><text class="typ" x="450" y="526">uuid</text><text class="tag" x="543" y="526">PK</text>
  <text class="col" x="327" y="548">company_id</text><text class="typ" x="450" y="548">uuid</text><text class="tag" x="543" y="548">FK</text>
  <text class="col" x="327" y="570">uploaded_by</text><text class="typ" x="450" y="570">uuid</text><text class="tag" x="543" y="570">FK</text>
  <text class="col" x="327" y="592">filename</text><text class="typ" x="450" y="592">text</text>
  <text class="col" x="327" y="614">content_type</text><text class="typ" x="450" y="614">text</text>
  <text class="col" x="327" y="636">size_bytes</text><text class="typ" x="450" y="636">bigint</text>
  <text class="col" x="327" y="658">storage_key</text><text class="typ" x="450" y="658">text</text><text class="tag" x="543" y="658">UQ</text>
  <text class="col" x="327" y="680">created_at</text><text class="typ" x="450" y="680">timestamptz</text>
  <text class="note" x="315" y="716">UNIQUE (company_id, filename)</text>
  <text class="note" x="315" y="732">INDEX (company_id, created_at)</text>
</svg>
