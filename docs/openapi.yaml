openapi: 3.1.0
info:
  description: "Multi-tenant file vault. Errors follow RFC 9457, see docs/errors.md."
  title: TeamVault API
  version: 0.1.0
servers:
- description: local dev
  url: http://localhost:8080
security:
- bearer: []
paths:
  /api/auth/login:
    post:
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      security: []
      tags:
      - auth
  /api/auth/register:
    post:
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Created
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      security: []
      tags:
      - auth
  /api/companies:
    get:
      operationId: listMyCompanies
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - companies
    post:
      operationId: createCompany
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCompanyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - companies
  /api/companies/{companyId}:
    get:
      operationId: getCompany
      parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - companies
  /api/companies/{companyId}/files:
    get:
      operationId: listFiles
      parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FileResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - files
    post:
      operationId: uploadFile
      parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
              - file
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - files
  /api/companies/{companyId}/files/{fileId}:
    get:
      operationId: getFile
      parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - files
  /api/companies/{companyId}/files/{fileId}/download:
    get:
      operationId: downloadFile
      parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      - in: path
        name: fileId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: string
                format: binary
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - files
  /api/companies/{companyId}/members:
    get:
      operationId: listMembers
      parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MemberResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - members
    post:
      operationId: addMember
      parameters:
      - in: path
        name: companyId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberResponse"
          description: Created
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - members
  /api/me:
    get:
      operationId: me
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Missing or invalid token, WWW-Authenticate: Bearer"
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      tags:
      - users
  /api/ping:
    get:
      operationId: ping
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PingResponse"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Error, see docs/errors.md"
      security: []
      tags:
      - ping
components:
  schemas:
    AddMemberRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        role:
          type: string
          enum:
          - MEMBER
          - ADMIN
      required:
      - email
    CompanyResponse:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        name:
          type: string
        role:
          type: string
          enum:
          - MEMBER
          - ADMIN
        tier:
          type: string
          enum:
          - SMALL
          - LARGE
    CreateCompanyRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 0
        tier:
          type: string
          enum:
          - SMALL
          - LARGE
      required:
      - name
      - tier
    FileResponse:
      type: object
      properties:
        contentType:
          type: string
        createdAt:
          type: string
          format: date-time
        filename:
          type: string
        id:
          type: string
          format: uuid
        sizeBytes:
          type: integer
          format: int64
        uploadedBy:
          type: string
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
      - email
      - password
    MemberResponse:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        role:
          type: string
          enum:
          - MEMBER
          - ADMIN
        since:
          type: string
          format: date-time
        userId:
          type: string
          format: uuid
    PingResponse:
      type: object
      properties:
        message:
          type: string
    ProblemDetail:
      type: object
      properties:
        detail:
          type: string
          description: "For humans, may change"
        errors:
          type: array
          description: validation-failed only
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string
        instance:
          type: string
          description: Request path
        requestId:
          type: string
          description: Same value as the X-Request-Id header
        status:
          type: integer
          format: int32
        title:
          type: string
        type:
          type: string
          format: uri
          description: Anchor into docs/errors.md; absent means about:blank
    RegisterRequest:
      type: object
      properties:
        displayName:
          type: string
          maxLength: 100
          minLength: 0
        email:
          type: string
          format: email
          maxLength: 254
          minLength: 0
        password:
          type: string
          maxLength: 72
          minLength: 8
      required:
      - displayName
      - email
      - password
    TokenResponse:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
        token:
          type: string
    UserResponse:
      type: object
      properties:
        displayName:
          type: string
        email:
          type: string
        id:
          type: string
          format: uuid
  securitySchemes:
    bearer:
      bearerFormat: JWT
      description: Access token from POST /api/auth/login
      scheme: bearer
      type: http
